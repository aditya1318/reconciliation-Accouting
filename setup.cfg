[metadata]
name = indian-bank-recon
version = 0.2.0
description = Comprehensive reconciliation system for Indian bank statements with OCR and email integration
long_description = file: README.md
long_description_content_type = text/markdown
author = Aditya
author_email = example@example.com
url = https://github.com/username/indian-bank-recon
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Financial and Insurance Industry
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Office/Business :: Financial :: Accounting
keywords = bank, reconciliation, accounting, finance, india, banking, ocr, email, invoice, bills

[options]
packages = find:
include_package_data = True
python_requires = >=3.8
install_requires =
    # Core dependencies
    pandas>=2.0.0
    numpy>=1.24.0
    python-dateutil>=2.8.2
    openpyxl>=3.1.0
    xlrd>=2.0.1
    fuzzywuzzy>=0.18.0
    python-Levenshtein>=0.21.0
    pyyaml>=6.0.0
    
    # OCR dependencies
    pytesseract>=0.3.10
    pdf2image>=1.16.3
    opencv-python>=4.8.0
    Pillow>=10.0.0
    
    # Email dependencies
    secure-smtplib>=0.1.1
    python-dotenv>=1.0.0
    email-validator>=2.0.0
    beautifulsoup4>=4.12.2

[options.entry_points]
console_scripts =
    bank-recon = bank_recon.cli:main
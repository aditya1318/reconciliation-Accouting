name: State Bank of India
id: sbi_bank
version: 1.0.0
description: Schema configuration for SBI Bank statements

source:
  supported_formats:
    - csv
    - excel
    - pdf
  encoding: utf-8
  csv_options:
    delimiter: ','
    header_row: 1
    skip_rows: 5  # SBI often has headers and metadata in first 5 rows
  excel_options:
    header_row: 5
    sheet_index: 0
  detection_rules:
    column_patterns:
      - Txn Date
      - Description
      - Ref No./Cheque No.
      - Debit
      - Credit
      - Balance

field_mappings:
  date:
    source: Txn Date
    type: date
    required: true
    format: '%d-%m-%Y'
  debit:
    source: Debit
    type: decimal
    required: false
    transform: clean_amount
  credit:
    source: Credit
    type: decimal
    required: false
    transform: clean_amount
  narration:
    source: Description
    type: string
    required: true
    transform: clean_description
  balance:
    source: Balance
    type: decimal
    required: true
    transform: clean_amount
  reference_no:
    source: Ref No./Cheque No.
    type: string
    required: false

derived_fields:
  transaction_id:
    transform: "lambda df, idx: f\"SBI_{idx}\""
    type: string
  payment_method:
    transform: extract_payment_method
    source: narration
    type: string
  transaction_category:
    transform: "lambda x: next((cat for cat in [\"SALARY\", \"ATM\", \"UPI\", \"NEFT\", \"RTGS\", \"IMPS\", \"CHEQUE\"] if cat in str(x).upper()), \"OTHER\")"
    source: narration
    type: string
  is_atm_withdrawal:
    transform: "lambda x: \"ATM\" in str(x).upper() and \"WITHDRAWAL\" in str(x).upper()"
    source: narration
    type: boolean

validation_rules:
  - rule: not_null
    field: date
    error_message: Transaction date cannot be null
  - rule: not_null
    field: narration
    error_message: Transaction description cannot be null
  - rule: custom
    expression: "~(df['debit'].isna() & df['credit'].isna()).all()"
    error_message: Either debit or credit amount must be provided
  - rule: custom
    expression: "df[df['debit'].notna()]['debit'] >= 0"
    error_message: Debit amounts must be positive

preprocessing:
  - action: replace_text
    column: Balance
    pattern: ",+"
    replacement: ""
  - action: convert_case
    column: Description
    case: upper
  - action: custom
    expression: "df['Description'] = df['Description'].str.replace('\\\\s+', ' ')"
    description: "Normalizing whitespace in descriptions"

audit:
  enabled: true
  track_fields:
    - date
    - narration
    - debit
    - credit
    - balance
    - reference_no
  track_transformations: true
  create_snapshots: true